<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My HR Depot</title>
    <!-- Apply the saved theme before first paint to avoid a flash. Light is the
         default; dark is applied only when the user has explicitly chosen it. -->
    <script>
      try {
        if (localStorage.getItem('mhd:theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
